<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="DATOS/css/style.css" />
    <link rel="icon" href="DATOS/img/flowers.png" type="image/x-icon" />
    <title>FLORES</title>
  </head>
  <body>
    <audio id="bg-music" src="DATOS/img/Floricienta.mp3" autoplay loop></audio>
    <button id="music-toggle" style="position: fixed; top: 20px; right: 20px; z-index: 9999; background: rgba(255,255,255,0.2); backdrop-filter: blur(5px); border: 2px solid #fff; border-radius: 50%; width: 50px; height: 50px; cursor: pointer; display: flex; justify-content: center; align-items: center; font-size: 24px; padding: 0; outline: none; transition: background 0.3s; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">🔇</button>
    <div class="greetings">
      <span>T</span>
      <span>E</span>
      <span> </span>
      <span>A</span>
      <span>M</span>
      <span>O</span>
    </div>

    <div class="greetings">
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
    </div>
    <div class="text">
      <span
        >Estas todavia no son verdaderas pero no te ibas a quedar sin tus flores
        amarillas, tengo una sorpresita para cuando nos veamos</span
      >
    </div>
    <div class="description">
      <span>SON PARA VOS AMOR <3</span>
    </div>
    <div class="button">
      <button>
        <a href="DATOS/FLORES.html">HACE CLICK PORFAVOR</a>
      </button>
    </div>
    <script>
      const audio = document.getElementById('bg-music');
      const musicBtn = document.getElementById('music-toggle');
      
      audio.addEventListener('play', () => { musicBtn.textContent = '🔊'; });
      audio.addEventListener('pause', () => { musicBtn.textContent = '🔇'; });

      musicBtn.addEventListener('click', () => {
        if (audio.paused) {
          audio.currentTime = 0;
          audio.play();
        } else {
          audio.pause();
        }
      });
    </script>
  </body>
</html>
